# Permission definitions for this app's own commands (defined directly in
# src/lib.rs, not a separate plugin). Tauri v2 only auto-generates
# allow-/deny- permissions for PLUGIN build scripts; a plain app crate's
# commands need to be declared here by hand, then referenced by identifier
# in capabilities/default.json.

[[permission]]
identifier = "allow-list-postings"
description = "Allows listing postings"
commands.allow = ["list_postings"]

[[permission]]
identifier = "allow-get-posting"
description = "Allows fetching one posting's detail"
commands.allow = ["get_posting"]

[[permission]]
identifier = "allow-set-posting-note"
description = "Allows setting or clearing a posting's note"
commands.allow = ["set_posting_note"]

[[permission]]
identifier = "allow-similar-postings"
description = "Allows fetching a posting's similar roles"
commands.allow = ["similar_postings"]

[[permission]]
identifier = "allow-hydrate-postings"
description = "Allows fetching full detail pages for scraped postings"
commands.allow = ["hydrate_postings"]

[[permission]]
identifier = "allow-star-posting"
description = "Allows starring a posting"
commands.allow = ["star_posting"]

[[permission]]
identifier = "allow-unstar-posting"
description = "Allows unstarring a posting"
commands.allow = ["unstar_posting"]

[[permission]]
identifier = "allow-dismiss-posting"
