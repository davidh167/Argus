name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://argus:argus@localhost:5432/argus
      API_TOKEN: ci-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install poetry
      - run: poetry install
      # The similarity engine's parity tests (tests/test_native_similarity.py) need libargus. Build it
      # without llama.cpp (-DARGUS_WITH_LLAMA=OFF: index and similarity only, no model, no GPU libraries);
      # the embedder tests still skip themselves. ICU does the Unicode work; usearch is fetched by CMake.
      - name: Build libargus (llama-free)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libicu-dev libsqlite3-dev
          cmake -S native -B native/build-release -G Ninja -DARGUS_WITH_LLAMA=OFF -DARGUS_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build-release --target argus
          echo "ARGUS_LIB_PATH=$GITHUB_WORKSPACE/native/build-release/libargus.so" >> "$GITHUB_ENV"
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy
      # Measured 84% locally; the floor sits a few points below so only a real drop fails CI.
      - run: poetry run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80

  desktop:
    name: desktop
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo check --locked

  # The index and similarity code without llama.cpp (-DARGUS_WITH_LLAMA=OFF): C++ tests under ASan + UBSan on
  # Linux, where ICU is the system library.
  native-linux:
    name: native (linux, no llama.cpp)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build catch2 libbenchmark-dev libicu-dev libsqlite3-dev
      - name: Configure C++ core (ASan + UBSan)
        run: cmake -S native -B "$RUNNER_TEMP/native-build" -G Ninja -DARGUS_WITH_LLAMA=OFF -DARGUS_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build C++ core
        run: cmake --build "$RUNNER_TEMP/native-build"
      - name: ctest
        run: ctest --test-dir "$RUNNER_TEMP/native-build" --output-on-failure

  native:
    name: native
    runs-on: macos-latest
    env:
      # Homebrew's stable symlink to the installed llama.cpp; build.rs links and sets the rpath from it.
      ARGUS_LLAMA_PREFIX: /opt/homebrew/opt/llama.cpp
    steps:
      - uses: actions/checkout@v7
      - run: brew install cmake ninja catch2 google-benchmark llama.cpp icu4c
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust/argus-core
      # Same configuration as native/README.md. The embedder tests skip themselves when no GGUF model
      # is present (ARGUS_MODEL unset, no Ollama blob), so the 274 MB model is never downloaded.
      - name: Configure C++ core (ASan + UBSan)
        run: cmake -S native -B "$RUNNER_TEMP/native-build" -G Ninja -DARGUS_BUILD_TESTS=ON -DARGUS_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build C++ core
        run: cmake --build "$RUNNER_TEMP/native-build"
      - name: ctest
        run: ctest --test-dir "$RUNNER_TEMP/native-build" --output-on-failure
      - name: cargo test (Rust bindings)
        working-directory: native/rust/argus-core
        run: cargo test --locked
